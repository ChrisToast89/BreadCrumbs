# Packaging — MILESTONES phase 8.
#
# The one thing that reliably breaks here: the ffmpeg and ffprobe executables
# get packed inside the app archive (asar), where the operating system cannot
# execute them. `asarUnpack` keeps them on the real filesystem, and
# src/main/media/binaries.ts rewrites the path at runtime to match.

appId: dev.breadcrumbs.app
productName: BreadCrumbs
copyright: Copyright (C) 2026 ChrisToast89. GPL v3.

directories:
  output: release
  buildResources: build

# Only what the application actually needs at runtime.
#
# WARNING: a list of positive patterns here does NOT act as a whitelist.
# electron-builder adds them to its defaults, which sweep in the whole project
# directory. It also does not read .gitignore. An earlier build therefore
# packaged samples/, inspect-out/ and fixtures/ — including a real source video
# and 70MB of generated preview copies — into an installer meant for
# distribution. Everything not needed at runtime must be excluded explicitly.
files:
  # IMPORTANT: a platform section's `files` REPLACES this list, it does not
  # merge with it. Each platform below therefore repeats these patterns in
  # full. Getting this wrong once put samples/, inspect-out/, src/ and .git
  # into the installer — including a real source video — because the only rule
  # in effect for a Windows build was the ffprobe trim in `win.files`.
  - '**/*'

  # Media: never ship anyone's video, supplied or generated.
  - '!samples'
  - '!samples/**'
  - '!fixtures'
  - '!fixtures/**'
  - '!inspect-out'
  - '!inspect-out/**'
  - '!release'
  - '!release/**'

  # Source, tooling, specs and version control.
  - '!.git'
  - '!.git/**'
  - '!src'
  - '!src/**'
  - '!tools'
  - '!tools/**'
  - '!build'
  - '!build/**'
  - '!electron.vite.config.ts'
  - '!electron-builder.yml'
  - '!tsconfig.json'
  - '!tsconfig.node.json'
  - '!tsconfig.web.json'
  - '!tsconfig.node.tsbuildinfo'
  - '!tsconfig.web.tsbuildinfo'
  - '!SPEC.md'
  - '!MILESTONES.md'
  - '!package-lock.json'
  - '!*.log'

# The GPL requires these travel with the binaries they cover.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: SOURCES.md
    to: SOURCES.md
  - from: THIRD-PARTY.md
    to: THIRD-PARTY.md

asar: true

# Executables cannot be run from inside the asar archive. Everything here stays
# unpacked on disk. Without this the app builds cleanly and then fails at
# runtime with a confusing "file not found", which is the failure mode the
# build plan warns about.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

win:
  files:
  - '**/*'

  # Media: never ship anyone's video, supplied or generated.
  - '!samples'
  - '!samples/**'
  - '!fixtures'
  - '!fixtures/**'
  - '!inspect-out'
  - '!inspect-out/**'
  - '!release'
  - '!release/**'

  # Source, tooling, specs and version control.
  - '!.git'
  - '!.git/**'
  - '!src'
  - '!src/**'
  - '!tools'
  - '!tools/**'
  - '!build'
  - '!build/**'
  - '!electron.vite.config.ts'
  - '!electron-builder.yml'
  - '!tsconfig.json'
  - '!tsconfig.node.json'
  - '!tsconfig.web.json'
  - '!tsconfig.node.tsbuildinfo'
  - '!tsconfig.web.tsbuildinfo'
  - '!SPEC.md'
  - '!MILESTONES.md'
  - '!package-lock.json'
  - '!*.log'

  # ffprobe-static carries all six platform builds; keep only this one.
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
  # One source image; electron-builder produces the .ico from it.
  icon: build/icon.png
  target:
    # Two ways in, both of them a single file the user double-clicks.
    - target: nsis
      arch: [x64]
    # `portable` produces ONE self-contained executable. The `zip` target was
    # dropped: it unpacked 97 files into whatever folder the user happened to
    # be in, with BreadCrumbs.exe buried among the DLLs. Nobody should have to
    # hunt for the thing they just downloaded.
    - target: portable
      arch: [x64]

nsis:
  # Installs without asking anything: download, double-click, it appears and
  # opens. The audience is people who want to cut up a video, not choose an
  # install directory.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BreadCrumbs
  # Still registered in Add or Remove Programs, so it can be removed normally.
  deleteAppDataOnUninstall: false

# Filenames carry the real semver, which is unambiguous for a downloaded file.
# The interface shows the friendlier 0.90b.
portable:
  artifactName: BreadCrumbs-${version}-portable.${ext}

mac:
  files:
  - '**/*'

  # Media: never ship anyone's video, supplied or generated.
  - '!samples'
  - '!samples/**'
  - '!fixtures'
  - '!fixtures/**'
  - '!inspect-out'
  - '!inspect-out/**'
  - '!release'
  - '!release/**'

  # Source, tooling, specs and version control.
  - '!.git'
  - '!.git/**'
  - '!src'
  - '!src/**'
  - '!tools'
  - '!tools/**'
  - '!build'
  - '!build/**'
  - '!electron.vite.config.ts'
  - '!electron-builder.yml'
  - '!tsconfig.json'
  - '!tsconfig.node.json'
  - '!tsconfig.web.json'
  - '!tsconfig.node.tsbuildinfo'
  - '!tsconfig.web.tsbuildinfo'
  - '!SPEC.md'
  - '!MILESTONES.md'
  - '!package-lock.json'
  - '!*.log'

  - '!node_modules/ffprobe-static/bin/win32/**'
  - '!node_modules/ffprobe-static/bin/linux/**'
  icon: build/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.video
  # Not signed or notarized: a paid Apple Developer account is deliberately out
  # of scope for this tool. Users bypass Gatekeeper once with right-click, Open.
  identity: null

linux:
  files:
  - '**/*'

  # Media: never ship anyone's video, supplied or generated.
  - '!samples'
  - '!samples/**'
  - '!fixtures'
  - '!fixtures/**'
  - '!inspect-out'
  - '!inspect-out/**'
  - '!release'
  - '!release/**'

  # Source, tooling, specs and version control.
  - '!.git'
  - '!.git/**'
  - '!src'
  - '!src/**'
  - '!tools'
  - '!tools/**'
  - '!build'
  - '!build/**'
  - '!electron.vite.config.ts'
  - '!electron-builder.yml'
  - '!tsconfig.json'
  - '!tsconfig.node.json'
  - '!tsconfig.web.json'
  - '!tsconfig.node.tsbuildinfo'
  - '!tsconfig.web.tsbuildinfo'
  - '!SPEC.md'
  - '!MILESTONES.md'
  - '!package-lock.json'
  - '!*.log'

  - '!node_modules/ffprobe-static/bin/win32/**'
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/ia32/**'
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  synopsis: Splits a video at its cuts and exports one still per shot

# Publishing is a deliberate act, never a side effect of building.
publish: null
